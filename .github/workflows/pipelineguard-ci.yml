name: PipelineGuard CI

on:
  push:
    branches: [main, feature/**]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    name: Lint, Type Check & Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r security/workflow/requirements.txt -r security/workflow/requirements-dev.txt

      - name: Run Ruff linter
        run: ruff check security

      - name: Run Mypy strict type checking
        run: python -m mypy --strict security

      - name: Run Bandit security scanner
        run: bandit -r security -x security/workflow/tests

      - name: Run Pip-audit dependency vulnerability check
        run: pip-audit -r security/workflow/requirements.txt

      - name: Run Pytest test suite with coverage gate
        run: python -m pytest security/workflow/tests/ -v

  dogfood-scan:
    name: PipelineGuard Self-Scan & SARIF Upload
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      # pipelineguard-ignore: PG-WF-005 GitHub Code Scanning upload requires security-events: write scope
      security-events: write
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Install runtime dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r security/workflow/requirements.txt

      - name: Dogfood scan repository workflows
        run: |
          python -m security.workflow scan .github/workflows --fail-on warn --format sarif --output pipelineguard.sarif

      - name: Upload PipelineGuard SARIF report
        uses: github/codeql-action/upload-sarif@ce5e7eeac396d720fe2d802714996c8ce561e311 # v3
        if: always()
        with:
          sarif_file: pipelineguard.sarif
