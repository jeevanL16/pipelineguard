# PipelineGuard - Gitleaks configuration
#
# This extends Gitleaks' own default rule set (all built-in rules,
# including generic-api-key, stay fully enabled and unmodified) and
# adds a path allowlist so that our own intentional dummy-secret test
# fixtures are not reported as production findings.
#
# This only affects scans that explicitly load this file with
# --config. It does NOT affect the pytest test suite, which scans
# isolated temporary directories that do not contain these paths.

[extend]
useDefault = true

[allowlist]
description = "Ignore PipelineGuard's own intentional dummy-secret test fixtures"
paths = [
  '''security/secrets/test/''',
  '''security/secrets/tests/''',
]
