name: Evasion GitHub Script Quoted
on:
  issues:
    types: [opened]
permissions:
  contents: read
jobs:
  comment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea
        with:
          script: "github.rest.issues.createComment({ body: '${{ format('{0}', github.event.issue.body) }}' })"
